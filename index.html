<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iamioo – Meine Spiele</title>
  <meta name="description" content="Browser-Spiele von Iamioo – direkt online spielen.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='2' fill='%23e52521'/><rect x='5' y='5' width='6' height='6' fill='%23fbd000'/></svg>">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></symbol>
    <symbol id="i-code" viewBox="0 0 16 16"><path d="M5.5 4 1.5 8l4 4M10.5 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gh" viewBox="0 0 16 16"><path fill="currentColor" d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.23 1.88.87 2.34.67.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0"/></symbol>
  </svg>

  <div class="wrap">
    <header class="top">
      <a class="logo" href="./"><span class="block" aria-hidden="true"></span>IAMIOO</a>
      <a class="text-link" href="https://github.com/Iamioo" target="_blank" rel="noopener">
        <svg class="icon" aria-hidden="true"><use href="#i-gh"/></svg>GitHub
      </a>
    </header>

    <section class="intro">
      <div>
        <h1>Meine <em>Spiele</em></h1>
        <p>Browser-Versionen von Spielen, die ich online gestellt habe. Läuft am PC und auf dem Handy, ohne Installation.</p>
      </div>
      <div class="finder">
        <label for="search" id="count">Spiele werden geladen …</label>
        <input class="search" id="search" type="search" placeholder="Titel oder Tag, z. B. RPG">
      </div>
    </section>

    <main class="shelf" id="shelf"></main>

    <footer>
      <span>© <span id="year"></span> Iamioo</span>
      <span><a href="https://github.com/Iamioo" target="_blank" rel="noopener">GitHub</a> · <a href="admin/">Admin</a></span>
    </footer>
  </div>

  <script>
    const shelf = document.getElementById('shelf');
    const search = document.getElementById('search');
    const count = document.getElementById('count');
    document.getElementById('year').textContent = new Date().getFullYear();
    let games = [];

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const safeUrl = u => /^(https?:\/\/|\.?\/?[\w-])/i.test(u || '') && !/^javascript:/i.test(u) ? u : '#';
    const icon = id => `<svg class="icon" aria-hidden="true"><use href="#i-${id}"/></svg>`;

    function render() {
      const q = search.value.trim().toLowerCase();
      const list = games.filter(g =>
        !q || [g.title, g.description, ...(g.tags || [])].join(' ').toLowerCase().includes(q));
      count.textContent = q
        ? `${list.length} von ${games.length} ${games.length === 1 ? 'Spiel' : 'Spielen'}`
        : `${games.length} ${games.length === 1 ? 'Spiel' : 'Spiele'} im Regal`;
      if (!list.length) { shelf.innerHTML = '<p class="empty">Kein Spiel passt zu deiner Suche.</p>'; return; }
      shelf.innerHTML = list.map(g => `
        <article class="game">
          <a class="shot" href="${esc(safeUrl(g.url))}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">
            ${g.image
              ? `<img src="${esc(safeUrl(g.image))}" alt="" loading="lazy">`
              : `<div class="noimg">${esc((g.title || '?').slice(0, 2).toUpperCase())}</div>`}
          </a>
          <div class="info">
            <span class="num">${String(games.indexOf(g) + 1).padStart(2, '0')}</span>
            <h2>${esc(g.title)}</h2>
            ${g.description ? `<p>${esc(g.description)}</p>` : ''}
            ${g.tags?.length ? `<ul class="tags">${g.tags.map(t => `<li class="tag">${esc(t)}</li>`).join('')}</ul>` : ''}
            <div class="actions">
              <a class="btn btn-play" href="${esc(safeUrl(g.url))}" target="_blank" rel="noopener">${icon('play')}Spielen</a>
              ${g.repo ? `<a class="text-link" href="${esc(safeUrl(g.repo))}" target="_blank" rel="noopener">${icon('code')}Quellcode</a>` : ''}
            </div>
          </div>
        </article>`).join('');
    }

    fetch('games.json?v=' + Date.now())
      .then(r => r.json())
      .then(data => { games = Array.isArray(data) ? data : []; render(); })
      .catch(() => { count.textContent = ''; shelf.innerHTML = '<p class="empty">Die Spiele konnten nicht geladen werden.</p>'; });
    search.addEventListener('input', render);
  </script>
</body>
</html>
